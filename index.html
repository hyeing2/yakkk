<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAKKK</title>
    <!-- reset.css -->
    <link rel="stylesheet" href="assets/css/reset.css">
    <!-- normalize.css -->
    <link rel="stylesheet" href="assets/css/normalize.css">
    <!-- style.css -->
    <link rel="stylesheet" href="assets/css/style.css">

</head>

<body>
    <!-- 헤더 -->
    <header class="header">
        <nav class="nav-container">
            <div class="logo">
                <a href="#"><img src="assets/images/kv/kv-logo.webp" alt="YAKKK LOGO"></a>
            </div>

            <ul class="gnb">
                <li><a href="#">브랜드</a></li>
                <li><a href="#">메뉴</a></li>
                <li><a href="#">매장</a></li>
                <li><a href="#">소식</a></li>
                <li><a href="#">ESG</a></li>
                <li><a href="#">고객의 소리</a></li>
            </ul>

            <div class="header-util">
                <button type="button" class="lang-btn">
                    <h5>KR</h5> <img src="assets/images/icon/lang-arrow.svg" alt="언어">
                </button>
                <a href="#" class="cta-btn">가맹문의</a>
            </div>
        </nav>
    </header>

    <!-- kv 시작 -->
<main class="kv">
    <div class="kv-wrapper">

        <!-- 왼쪽 사이드 접시 + 디저트 -->
        <div class="side-dish-wrap l-dish">
            <div class="dessert-slider">
                <img src="assets/images/kv/top-scone.webp"     alt="스콘"      class="dessert-img active">
                <img src="assets/images/kv/top-bcc.webp"       alt="BCC"       class="dessert-img">
                <img src="assets/images/kv/top-sand.webp"      alt="샌드"      class="dessert-img">
                <img src="assets/images/kv/top-k-donut.webp"   alt="K도넛"     class="dessert-img">
                <img src="assets/images/kv/top-financier.webp" alt="피낭시에"  class="dessert-img">
                <img src="assets/images/kv/top-cupcake.webp"   alt="컵케이크"  class="dessert-img">
            </div>
            <img src="assets/images/kv/s-dish.webp" alt="사이드 접시" class="side-dish">
        </div>

        <!-- 중앙 메인 비주얼 -->
        <div class="kv-main-visual">
            <div class="dish-container">
                <img src="assets/images/kv/m-dish.webp" alt="메인 접시" class="m-dish">
                <img src="assets/images/kv/kv-logo.webp" alt="YAKKK" class="kv-logo">
            </div>
        </div>

        <!-- 오른쪽 사이드 접시 + 디저트 -->
        <div class="side-dish-wrap r-dish">
            <div class="dessert-slider">
                <img src="assets/images/kv/top-scone.webp"     alt="스콘"      class="dessert-img active">
                <img src="assets/images/kv/top-bcc.webp"       alt="BCC"       class="dessert-img">
                <img src="assets/images/kv/top-sand.webp"      alt="샌드"      class="dessert-img">
                <img src="assets/images/kv/top-k-donut.webp"   alt="K도넛"     class="dessert-img">
                <img src="assets/images/kv/top-financier.webp" alt="피낭시에"  class="dessert-img">
                <img src="assets/images/kv/top-cupcake.webp"   alt="컵케이크"  class="dessert-img">
            </div>
            <img src="assets/images/kv/s-dish.webp" alt="사이드 접시" class="side-dish">
        </div>

    </div>
</main>

    <script src="assets/js/kv.js"></script>

    <!-- 브랜드 스토리 섹션 -->
    <section class="brand-story">
        <div class="container">
            <div class="brand-story__inner">

                <!-- 왼쪽: 텍스트 + 버튼 -->
                <div class="story-text-wrap">

                    <!-- 그룹 1: 메인 타이틀 -->
                    <div class="story-title-group">
                        <p class="story-eyebrow">100년의 전통 vs 오늘의 트렌드,</p>
                        <h2 class="story-headline">약과에 미친 두 마스코트의</h2>
                        <h2 class="story-headline">
                            <span class="text-point">유쾌한</span><span class="text-main"> 충돌!</span>
                        </h2>
                    </div>

                    <!-- 그룹 2: 서브 설명 -->
                    <div class="story-desc-group">
                        <p class="story-desc">가장 한국적이면서도 가장 트렌디한 반전매력,</p>
                        <p class="story-desc">고정관념을 깨부수는 진짜 힙한 K-디저트 연구가</p>
                        <p class="story-desc">지금 시작 됩니다.</p>
                    </div>

                    <!-- 그룹 3: 버튼 -->
                    <div class="story-btn-group">
                        <a href="#" class="btn-story">
                            YAKKK 스토리 더 보기
                            <img src="assets/images/icon/sec2-arrow.svg" alt="화살표">
                        </a>
                    </div>

                </div>

                <!-- 오른쪽: 마스코트 비주얼 (추후 이미지 삽입) -->
                <div class="story-visual-wrap" aria-hidden="true"></div>

            </div>
        </div>
    </section>

</body>
</html>
