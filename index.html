<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAKKK</title>
    <!-- reset.css -->
    <link rel="stylesheet" href="assets/css/reset.css">
    <!-- normalize.css -->
    <link rel="stylesheet" href="assets/css/normalize.css">
    <!-- style.css -->
    <link rel="stylesheet" href="assets/css/style.css">

</head>

<body>
    <!-- 헤더 -->
    <header class="header">
        <nav class="nav-container">
            <div class="logo">
                <a href="#"><img src="assets/images/kv/kv-logo.webp" alt="YAKKK LOGO"></a>
            </div>

            <ul class="gnb">
                <li><a href="#">브랜드</a></li>
                <li><a href="#">메뉴</a></li>
                <li><a href="#">매장</a></li>
                <li><a href="#">소식</a></li>
                <li><a href="#">ESG</a></li>
                <li><a href="#">고객의 소리</a></li>
                <li class="gnb-cta"><a href="#" class="cta-btn cta-btn--mobile">가맹문의</a></li>
            </ul>

            <div class="header-util">
                <a href="#" class="cta-btn cta-btn--desktop">가맹문의</a>
                <!-- 모바일 햄버거 버튼 -->
                <button type="button" class="hamburger" aria-label="메뉴 열기" aria-expanded="false">
                    <img src="assets/images/icon/hamburger.svg" alt="메뉴" class="hamburger-icon">
                </button>
            </div>
        </nav>
    </header>

    <!-- kv 시작 -->
<main class="kv">
    <div class="kv-wrapper">

        <!-- 왼쪽 사이드 접시 + 디저트 -->
        <div class="side-dish-wrap l-dish">
            <div class="dessert-slider">
                <img src="assets/images/kv/top-scone.webp"     alt="스콘"      class="dessert-img active">
                <img src="assets/images/kv/top-bcc.webp"       alt="BCC"       class="dessert-img">
                <img src="assets/images/kv/top-sand.webp"      alt="샌드"      class="dessert-img">
                <img src="assets/images/kv/top-k-donut.webp"   alt="K도넛"     class="dessert-img">
                <img src="assets/images/kv/top-financier.webp" alt="피낭시에"  class="dessert-img">
                <img src="assets/images/kv/top-cupcake.webp"   alt="컵케이크"  class="dessert-img">
            </div>
            <img src="assets/images/kv/s-dish.webp" alt="사이드 접시" class="side-dish">
        </div>

        <!-- 중앙 메인 비주얼 -->
        <div class="kv-main-visual">
            <div class="dish-container">
                <img src="assets/images/kv/m-dish.webp" alt="메인 접시" class="m-dish">
                <img src="assets/images/kv/kv-logo.webp" alt="YAKKK" class="kv-logo">
            </div>
        </div>

        <!-- 오른쪽 사이드 접시 + 디저트 -->
        <div class="side-dish-wrap r-dish">
            <div class="dessert-slider">
                <img src="assets/images/kv/top-scone.webp"     alt="스콘"      class="dessert-img active">
                <img src="assets/images/kv/top-bcc.webp"       alt="BCC"       class="dessert-img">
                <img src="assets/images/kv/top-sand.webp"      alt="샌드"      class="dessert-img">
                <img src="assets/images/kv/top-k-donut.webp"   alt="K도넛"     class="dessert-img">
                <img src="assets/images/kv/top-financier.webp" alt="피낭시에"  class="dessert-img">
                <img src="assets/images/kv/top-cupcake.webp"   alt="컵케이크"  class="dessert-img">
            </div>
            <img src="assets/images/kv/s-dish.webp" alt="사이드 접시" class="side-dish">
        </div>

    </div>
</main>

    <script src="assets/js/kv.js"></script>
    <script>
        // 햄버거 메뉴 토글
        const hamburger = document.querySelector('.hamburger');
        const gnb = document.querySelector('.gnb');

        hamburger.addEventListener('click', () => {
            const isOpen = gnb.classList.toggle('is-open');
            hamburger.classList.toggle('is-active', isOpen);
            hamburger.setAttribute('aria-expanded', isOpen);
        });

        // 메뉴 링크 클릭 시 닫기
        gnb.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                gnb.classList.remove('is-open');
                hamburger.classList.remove('is-active');
                hamburger.setAttribute('aria-expanded', false);
            });
        });
    </script>

    <!-- 브랜드 스토리 섹션 -->
    <section class="brand-story">
        <div class="container">
            <div class="brand-story__inner">

                <!-- 왼쪽: 텍스트 + 버튼 -->
                <div class="story-text-wrap">

                    <!-- 그룹 1: 메인 타이틀 -->
                    <div class="story-title-group">
                        <p class="story-eyebrow">100년의 전통 vs 오늘의 트렌드,</p>
                        <h2 class="story-headline">약과에 미친 두 마스코트의</h2>
                        <h2 class="story-headline">
                            <span class="text-point">유쾌한</span><span class="text-main"> 충돌!</span>
                        </h2>
                    </div>

                    <!-- 그룹 2: 서브 설명 -->
                    <div class="story-desc-group">
                        <p class="story-desc">가장 한국적이면서도 가장 트렌디한 반전매력,</p>
                        <p class="story-desc">고정관념을 깨부수는 진짜 힙한 K-디저트 연구가</p>
                        <p class="story-desc">지금 시작 됩니다.</p>
                    </div>

                    <!-- 그룹 3: 버튼 -->
                    <div class="story-btn-group">
                        <a href="#" class="btn-story">
                            YAKKK 스토리 더 보기
                            <img src="assets/images/icon/sec2-arrow.svg" alt="화살표">
                        </a>
                    </div>

                </div>

                <!-- 오른쪽: 마스코트 비주얼 -->
                <div class="story-visual-wrap">

                    <!-- 배경 장식 텍스트 -->
                    <span class="story-bg-text" aria-hidden="true">YAKKK!</span>

                    <!-- 마스코트 콘텐츠 래퍼 -->
                    <div class="mascot-wrap">

                        <!-- YAKI 야키 박스 -->
                        <div class="mascot-col mascot-yaki">
                            <!-- 상단: 이미지(왼쪽) + 이름(오른쪽, 이미지 상단 정렬) -->
                            <div class="mascot-figure mascot-figure--yaki">
                                <img src="assets/images/brand/yaki.webp" alt="야키 캐릭터" class="mascot-img mascot-img--yaki">
                                <div class="mascot-name mascot-name--yaki">
                                    <span class="name-en">YAKI</span>
                                    <span class="name-ko">약이</span>
                                </div>
                            </div>
                            <!-- 하단: 체크리스트 (이미지 기준 왼쪽 하단) -->
                            <ul class="mascot-checklist mascot-checklist--yaki">
                                <li class="checklist-item">
                                    <img src="assets/images/icon/sec2-check.svg" alt="" class="check-icon check-icon--yaki">
                                    <span>전통 고수</span>
                                </li>
                                <li class="checklist-item">
                                    <img src="assets/images/icon/sec2-check.svg" alt="" class="check-icon check-icon--yaki">
                                    <span>바른 생활</span>
                                </li>
                                <li class="checklist-item">
                                    <img src="assets/images/icon/sec2-check.svg" alt="" class="check-icon check-icon--yaki">
                                    <span>깊고 진한 풍미</span>
                                </li>
                            </ul>
                        </div>

                        <!-- VS -->
                        <div class="mascot-vs" aria-hidden="true">VS</div>

                        <!-- KIKI 키키 박스 -->
                        <div class="mascot-col mascot-kiki">
                            <!-- 상단: 이름(왼쪽, 이미지 하단 정렬) + 이미지(오른쪽) -->
                            <div class="mascot-figure mascot-figure--kiki">
                                <div class="mascot-name mascot-name--kiki">
                                    <span class="name-en">KIKI</span>
                                    <span class="name-ko">키키</span>
                                </div>
                                <img src="assets/images/brand/kiki.webp" alt="키키 캐릭터" class="mascot-img mascot-img--kiki">
                            </div>
                            <!-- 하단: 체크리스트 (이미지 기준 오른쪽 하단) -->
                            <ul class="mascot-checklist mascot-checklist--kiki">
                                <li class="checklist-item">
                                    <img src="assets/images/icon/sec2-check.svg" alt="" class="check-icon check-icon--kiki">
                                    <span>트렌드 선도</span>
                                </li>
                                <li class="checklist-item">
                                    <img src="assets/images/icon/sec2-check.svg" alt="" class="check-icon check-icon--kiki">
                                    <span>장난꾸러기 악동</span>
                                </li>
                                <li class="checklist-item">
                                    <img src="assets/images/icon/sec2-check.svg" alt="" class="check-icon check-icon--kiki">
                                    <span>화려한 토핑 마스터</span>
                                </li>
                            </ul>
                        </div>

                    </div><!-- /.mascot-wrap -->
                </div><!-- /.story-visual-wrap -->

            </div>
        </div>
    </section>

</body>
</html>
