<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAKKK</title>
    <!-- reset.css -->
    <link rel="stylesheet" href="assets/css/reset.css">
    <!-- normalize.css -->
    <link rel="stylesheet" href="assets/css/normalize.css">
    <!-- style.css -->
    <link rel="stylesheet" href="assets/css/style.css">

</head>

<body>
    <!-- 헤더 -->
    <header class="header">
        <nav class="nav-container">
            <div class="logo">
                <a href="#"><img src="assets/images/kv/kv-logo.webp" alt="YAKKK LOGO"></a>
            </div>

            <ul class="gnb">
                <li><a href="#">브랜드</a></li>
                <li><a href="#">메뉴</a></li>
                <li><a href="#">매장</a></li>
                <li><a href="#">소식</a></li>
                <li><a href="#">ESG</a></li>
                <li><a href="#">고객의 소리</a></li>
            </ul>

            <div class="header-util">
                <button type="button" class="lang-btn">
                    <h5>KR</h5> <img src="assets/images/icon/lang-arrow.svg" alt="언어">
                </button>
                <a href="#" class="cta-btn">가맹문의</a>
            </div>
        </nav>
    </header>

    <!-- kv 시작 -->
<main class="kv">
    <div class="kv-wrapper">

        <!-- 왼쪽 사이드 접시 + 디저트 -->
        <div class="side-dish-wrap l-dish">
            <div class="dessert-slider">
                <img src="assets/images/kv/top-scone.webp"     alt="스콘"      class="dessert-img active">
                <img src="assets/images/kv/top-bcc.webp"       alt="BCC"       class="dessert-img">
                <img src="assets/images/kv/top-sand.webp"      alt="샌드"      class="dessert-img">
                <img src="assets/images/kv/top-k-donut.webp"   alt="K도넛"     class="dessert-img">
                <img src="assets/images/kv/top-financier.webp" alt="피낭시에"  class="dessert-img">
                <img src="assets/images/kv/top-cupcake.webp"   alt="컵케이크"  class="dessert-img">
            </div>
            <img src="assets/images/kv/s-dish.webp" alt="사이드 접시" class="side-dish">
        </div>

        <!-- 중앙 메인 비주얼 -->
        <div class="kv-main-visual">
            <div class="dish-container">
                <img src="assets/images/kv/m-dish.webp" alt="메인 접시" class="m-dish">
                <img src="assets/images/kv/kv-logo.webp" alt="YAKKK" class="kv-logo">
            </div>
        </div>

        <!-- 오른쪽 사이드 접시 + 디저트 -->
        <div class="side-dish-wrap r-dish">
            <div class="dessert-slider">
                <img src="assets/images/kv/top-scone.webp"     alt="스콘"      class="dessert-img active">
                <img src="assets/images/kv/top-bcc.webp"       alt="BCC"       class="dessert-img">
                <img src="assets/images/kv/top-sand.webp"      alt="샌드"      class="dessert-img">
                <img src="assets/images/kv/top-k-donut.webp"   alt="K도넛"     class="dessert-img">
                <img src="assets/images/kv/top-financier.webp" alt="피낭시에"  class="dessert-img">
                <img src="assets/images/kv/top-cupcake.webp"   alt="컵케이크"  class="dessert-img">
            </div>
            <img src="assets/images/kv/s-dish.webp" alt="사이드 접시" class="side-dish">
        </div>

    </div>
</main>

    <script src="assets/js/kv.js"></script>
</body>
</html>
